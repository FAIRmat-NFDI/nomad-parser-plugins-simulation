name: migration-snapshot-tests
# Manually triggered additivity check. Runs tests/parsers/check_additivity.sh --
# the same script developers run locally -- to snapshot two refs (a `target`
# baseline and the `source` under test) and verify the source only adds to the
# target (no archive leaf removed or modified). Snapshots are generated as plain
# JSON, never tracked; CI adds a per-SHA cache so unchanged refs are reused.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Baseline ref whose data must not change'
        default: 'develop'
      source:
        description: 'Ref under test (default: the dispatched branch)'
        default: ''
      parsers:
        description: 'Parsers to snapshot, space-separated (default: autodetect from the diff)'
        default: ''

permissions:
  contents: read

env:
  UV_SYSTEM_PYTHON: true

jobs:
  snapshot-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # full history so arbitrary source/target refs resolve

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: 3.11
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: |
        pip install --upgrade pip
        uv pip install -e '.[dev,md]'

    - name: Resolve source and target refs (for cache keys)
      id: refs
      run: |
        set -euo pipefail
        TARGET='${{ inputs.target }}'
        SOURCE='${{ inputs.source }}'
        [ -z "$SOURCE" ] && SOURCE='${{ github.ref_name }}'
        resolve () {
          git fetch --quiet origin "$1" 2>/dev/null || true
          git rev-parse --verify --quiet "origin/$1" || git rev-parse --verify "$1"
        }
        {
          echo "target=$TARGET"
          echo "source=$SOURCE"
          echo "target_sha=$(resolve "$TARGET")"
          echo "source_sha=$(resolve "$SOURCE")"
        } >> "$GITHUB_OUTPUT"

    # Cache each ref's snapshot on its SHA + the requested parser set;
    # check_additivity.sh reuses any .json that already exists, so a cache hit
    # skips that ref's regeneration.
    - name: Restore cached target snapshot
      uses: actions/cache@v4
      with:
        path: target_snapshots.json
        key: snapshot-${{ steps.refs.outputs.target_sha }}-${{ inputs.parsers }}-py311-v2
    - name: Restore cached source snapshot
      uses: actions/cache@v4
      with:
        path: source_snapshots.json
        key: snapshot-${{ steps.refs.outputs.source_sha }}-${{ inputs.parsers }}-py311-v2

    - name: Run additivity check
      run: |
        set -o pipefail
        bash tests/parsers/check_additivity.sh \
          '${{ steps.refs.outputs.target }}' '${{ steps.refs.outputs.source }}' \
          ${{ inputs.parsers }} \
          | tee comparison_report.txt

    - name: Upload snapshots and diff for inspection
      if: always()  # also publish on failure so the diff can be reviewed
      uses: actions/upload-artifact@v4
      with:
        name: migration-snapshots
        path: |
          target_snapshots.json
          source_snapshots.json
          comparison_report.txt
        retention-days: 30
