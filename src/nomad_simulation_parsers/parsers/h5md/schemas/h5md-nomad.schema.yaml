schema: h5md-nomad
schema_version: 0.1.0
description: >
  First machine-readable slice of the H5MD-NOMAD HDF5 layout. This focuses on
  the structural header and the core particles/all trajectory groups used by
  the current parser/export discussion. It is intentionally an H5MD-NOMAD
  profile, not a complete strict H5MD schema.
limitations:
  - Fixed-step storage with scalar step/time increments and offsets is not yet modeled.
  - Hard-link equality between shared step/time datasets is not yet enforced.
  - Observables, connectivity, and parameters are only represented as optional root groups.

root:
  type: group
  children:
    h5md:
      type: group
      required: true
      attributes:
        version:
          dtype: integer
          shape: [2]
          required: true
      children:
        author:
          type: group
          required: true
          attributes:
            name:
              dtype: string
              shape: []
              required: true
            email:
              dtype: string
              shape: []
              required: false
        creator:
          type: group
          required: true
          attributes:
            name:
              dtype: string
              shape: []
              required: true
            version:
              dtype: string
              shape: []
              required: true
        program:
          type: group
          required: false
          attributes:
            name:
              dtype: string
              shape: []
              required: true
            version:
              dtype: string
              shape: []
              required: true

    particles:
      type: group
      required: false
      children:
        all:
          type: group
          required: true
          children:
            box:
              type: group
              required: true
              attributes:
                dimension:
                  dtype: integer
                  shape: []
                  required: false
                boundary:
                  description: >
                    H5MD stores boundary as strings such as periodic/none.
                    H5MD-NOMAD also accepts the documented boolean form where
                    true means periodic.
                  dtype: [bool, string]
                  shape: [spatial_dimension]
                  required: false
              children:
                edges:
                  required: false
                  any_of:
                    - type: group
                      attributes:
                        unit:
                          dtype: string
                          shape: []
                          required: false
                        unit_factor:
                          dtype: numeric
                          shape: []
                          required: false
                      children:
                        step:
                          type: dataset
                          dtype: integer
                          shape: [box_frames]
                          required: true
                        time:
                          type: dataset
                          dtype: numeric
                          shape: [box_frames]
                          required: false
                        value:
                          required: true
                          any_of:
                            - type: dataset
                              dtype: numeric
                              shape: [box_frames, spatial_dimension]
                            - type: dataset
                              dtype: numeric
                              shape: [box_frames, spatial_dimension, spatial_dimension]
                    - type: dataset
                      dtype: numeric
                      shape: [spatial_dimension]
                    - type: dataset
                      dtype: numeric
                      shape: [spatial_dimension, spatial_dimension]
            position:
              type: group
              required: false
              attributes:
                unit:
                  dtype: string
                  shape: []
                  required: false
                unit_factor:
                  dtype: numeric
                  shape: []
                  required: false
              children:
                step:
                  type: dataset
                  dtype: integer
                  shape: [position_frames]
                  required: true
                time:
                  type: dataset
                  dtype: numeric
                  shape: [position_frames]
                  required: false
                value:
                  type: dataset
                  dtype: numeric
                  shape: [position_frames, n_particles, spatial_dimension]
                  required: true
            velocity:
              type: group
              required: false
              attributes:
                unit:
                  dtype: string
                  shape: []
                  required: false
                unit_factor:
                  dtype: numeric
                  shape: []
                  required: false
              children:
                step:
                  type: dataset
                  dtype: integer
                  shape: [velocity_frames]
                  required: true
                time:
                  type: dataset
                  dtype: numeric
                  shape: [velocity_frames]
                  required: false
                value:
                  type: dataset
                  dtype: numeric
                  shape: [velocity_frames, n_particles, spatial_dimension]
                  required: true
            species_label:
              type: dataset
              description: H5MD-NOMAD extension for particle species labels.
              dtype: string
              shape: [n_particles]
              required: false
            id:
              type: group
              required: false
              children:
                value:
                  type: dataset
                  dtype: integer
                  shape: [n_particles]
                  required: true

    observables:
      type: group
      required: false
    connectivity:
      type: group
      required: false
    parameters:
      type: group
      required: false
