# Parser Test Matrix for Exhaustive CLI Testing
# Defines all test cases with expected outcomes for first-order validation

parsers:
  abinit:
    test_cases:
      - name: "Fe single point"
        mainfile: "tests/data/abinit/Fe/Fe.out"
        expected_workflow: "SinglePoint"
        required_fields:
          - "data.model_system"
          - "data.model_method"
          - "data.outputs"

      - name: "H2 geometry optimization"
        mainfile: "tests/data/abinit/H2/H2.out"
        expected_workflow: "GeometryOptimization"
        required_fields:
          - "data.model_system"
          - "data.outputs"
          - "workflow2.method"

