        skip: true  # No test data yet - will be created

# Global validation checks applied to all test cases
global_checks:
  - check: "archive_not_none"
    description: "Archive object created"

  - check: "simulation_present"
    description: "data.simulations populated"

  - check: "program_identified"
    description: "Program name and version extracted"
    fields:
      - "data.program.name"

  - check: "workflow_type_correct"
    description: "Workflow type matches expected"

  - check: "required_fields_present"
    description: "All required fields populated"
